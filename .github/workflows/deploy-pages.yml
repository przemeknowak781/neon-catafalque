name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/parametric-music-generation-kiznyh]
  workflow_dispatch:

# Least privilege: read the repo, publish a Pages artifact, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The conformance harness is the reason this project claims to make an
      # earworm at all, so a build that fails it should not reach the web.
      - name: Verify earworm conformance
        run: npm run verify:earworm

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # No GEMINI_API_KEY is provided on purpose. The key is pasted at runtime
      # and kept in the visitor's own browser, so nothing secret is baked into
      # a bundle that is served publicly.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Fail if a key leaked into the bundle
        run: |
          if grep -rqE 'AIza[0-9A-Za-z_-]{35}' dist; then
            echo "::error::A Google API key appears in the built output. Refusing to publish."
            exit 1
          fi
          echo "No API key found in dist."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
